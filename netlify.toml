[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rebuild the cached site list once a day (06:00 UTC). The bot reads the cache
# for instant responses and falls back to a live Kinsta fetch on a miss.
[functions."refresh-sites"]
  schedule = "0 6 * * *"

[[redirects]]
  from = "/slack/events"
  to = "/.netlify/functions/slack-bot"
  status = 200